# Validate application, SDK, tenant policies, and the deployable image without production secrets.
name: Validate deployment
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: smartroute_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smartroute_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Backend and PostgreSQL policies
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:ci-only-password@localhost:5432/smartroute_ci
        run: python -m pytest -q backend/tests -o pythonpath=backend
      - name: SDK tests
        run: python -m pytest -q -c sdk/pyproject.toml sdk/tests
      - name: Frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund
      - name: Frontend build
        run: npm --prefix frontend run build
      - name: Frontend lint
        run: npm --prefix frontend run lint
      - name: Docker build
        run: docker build --tag smartroute:ci .